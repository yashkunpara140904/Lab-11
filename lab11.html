<!DOCTYPE html>
<html>
<head>
<title>Technical Store - Navbar</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<!-- Header -->
<header class="bg-gradient-to-r from-gray-950 via-emerald-950 to-teal-800 text-white
px-8 py-5 shadow-xl">
<div class="flex justify-between items-center">
<!-- Logo -->
<h1 class="text-3xl font-extrabold tracking-wide">
Technical <span class="text-emerald-400">Store.</span>
</h1>
<!-- Navigation -->
<nav class="flex items-center gap-3">
<a href="#"
class="px-4 py-2 rounded-full hover:bg-emerald-400/20 hover:text-emerald-300

transition duration-300">

Home
</a>
<a href="#"
class="px-4 py-2 rounded-full hover:bg-emerald-400/20 hover:text-emerald-300

transition duration-300">
About
</a>
<!-- Dropdown -->
<div class="relative group">

<button class="px-4 py-2 rounded-full hover:bg-emerald-400/20 hover:text-
emerald-300 transition duration-300">

Products

<span class="inline-block group-hover:rotate-180 transition duration-
300">▼</span>

</button>
<div class="hidden group-hover:block group-focus-within:block absolute right-0

top-full pt-3 w-48 z-10">

<div class="bg-white text-gray-800 rounded-xl shadow-2xl p-2 border border-
emerald-100">

<a href="#"

class="block px-4 py-3 rounded-lg hover:bg-emerald-50 hover:text-
emerald-700 transition duration-200">

Laptop
</a>

<a href="#"

class="block px-4 py-3 rounded-lg hover:bg-emerald-50 hover:text-
emerald-700 transition duration-200">

Mobile
</a>
<a href="#"

class="block px-4 py-3 rounded-lg hover:bg-emerald-50 hover:text-
emerald-700 transition duration-200">

Shoes
</a>
<a href="#"

class="block px-4 py-3 rounded-lg hover:bg-emerald-50 hover:text-
emerald-700 transition duration-200">

⌚ Watches
</a>
</div>
</div>
</div>
<a href="#"
class="px-4 py-2 rounded-full hover:bg-emerald-400/20 hover:text-emerald-300

transition duration-300">
Contact
</a>
<!-- Login Button -->
<a href="#"
class="ml-3 bg-emerald-400 text-gray-950 font-bold px-6 py-2 rounded-full
shadow-md hover:bg-emerald-300 hover:scale-105 transition duration-300">

Login
</a>
</nav>
</div>
</header>
</body>
</html>
